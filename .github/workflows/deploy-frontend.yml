name: Deploy Frontends to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build Receipt Calculator
      - name: Install dependencies (receipt-calculator)
        working-directory: frontend/receipt-calculator
        run: npm install

      - name: Build (receipt-calculator)
        working-directory: frontend/receipt-calculator
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.RECEIPT_CALCULATOR_API_URL }}
          # Enhanced OCR: same Railway host as ReceiptCalculator.Api — key stays on server only.
          VITE_VISION_PROXY_URL: ${{ vars.RECEIPT_CALCULATOR_API_URL }}
          VITE_SUPPORT_URL: ${{ vars.RECEIPT_CALC_SUPPORT_URL }}
          VITE_ADSENSE_CLIENT: ${{ vars.RECEIPT_CALC_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT: ${{ vars.RECEIPT_CALC_ADSENSE_SLOT }}

      # Build Restaurant Finder (frontend-only; optional env overrides for OSM endpoints)
      - name: Install dependencies (restaurant-finder)
        working-directory: frontend/restaurant-finder
        run: npm install

      - name: Build (restaurant-finder)
        working-directory: frontend/restaurant-finder
        run: npm run build

      - name: Install dependencies (diff-lab)
        working-directory: frontend/diff-lab
        run: npm install

      - name: Build (diff-lab)
        working-directory: frontend/diff-lab
        run: npm run build

      # Combine builds into single pages folder
      - name: Prepare Pages
        run: |
          mkdir -p _site/receipt-calculator
          mkdir -p _site/restaurant-finder
          mkdir -p _site/diff-lab
          cp -r frontend/receipt-calculator/dist/* _site/receipt-calculator/
          cp -r frontend/restaurant-finder/dist/* _site/restaurant-finder/
          cp -r frontend/diff-lab/dist/* _site/diff-lab/
          cp frontend/index.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
